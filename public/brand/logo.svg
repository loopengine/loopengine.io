<svg width="260" height="44" viewBox="0 0 260 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boss Loop logo">
  <!--
    Boss Loop — light theme wordmark (v10: Open Loop with Governance Gate).
    Mark = ink rounded perimeter (operational cycle), opened on the right
           edge by a teal governance gate (supervised transition).
    No arrows. Circulation is implied by the containment shape.
  -->
  <g transform="translate(2 4)">
    <!-- governance perimeter — open on the right edge -->
    <path
      d="M 34 13 L 34 8 A 6 6 0 0 0 28 2 L 8 2 A 6 6 0 0 0 2 8 L 2 28 A 6 6 0 0 0 8 34 L 28 34 A 6 6 0 0 0 34 28 L 34 23"
      fill="none"
      stroke="#0A0F1E"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- governance gate — teal vertical bar in the right-edge gap -->
    <rect x="32" y="13" width="4" height="10" rx="1" ry="1" fill="#0F766E"/>
  </g>
  <text
    x="46"
    y="28"
    fill="#0A0F1E"
    font-family="'Inter Tight', 'Söhne', 'Geist', 'IBM Plex Sans', 'Manrope', 'DM Sans', system-ui, sans-serif"
    font-size="17"
    font-weight="600"
    letter-spacing="2"
  >BOSS LOOPS</text>
  <text
    x="190"
    y="22"
    fill="#94A3B8"
    font-family="'Inter Tight', 'IBM Plex Sans', system-ui, sans-serif"
    font-size="8"
    font-weight="500"
  >TM</text>
</svg>
