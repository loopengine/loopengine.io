<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boss Loop mark">
  <!--
    Boss Loop standalone mark, 64×64 (v10: Open Loop with Governance Gate).
    Ink rounded perimeter (the bounded operational cycle), opened on the
    right edge by a teal governance gate (the supervised transition).
    No arrows. Motion is inferred from the containment shape.
  -->
  <!-- governance perimeter — open on the right edge -->
  <path
    d="M 56 24 L 56 18 A 10 10 0 0 0 46 8 L 18 8 A 10 10 0 0 0 8 18 L 8 46 A 10 10 0 0 0 18 56 L 46 56 A 10 10 0 0 0 56 46 L 56 40"
    fill="none"
    stroke="#0A0F1E"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- governance gate — teal vertical bar in the right-edge gap -->
  <rect x="53.5" y="25" width="5" height="14" rx="1.5" ry="1.5" fill="#0F766E"/>
</svg>
